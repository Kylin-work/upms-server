version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: upms_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: upms
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: upms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:

