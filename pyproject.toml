[project]
name = "upms"
version = "0.1.0"
description = "连锁零售企业统一权限管理系统（UPMS）"
readme = "README.md"
authors = [
    { name = "gaoyu", email = "gaoyu.workmail@gmail.com" }
]
requires-python = ">=3.12.15"
dependencies = [
    "django~=5.2.8",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.7.3",
    "mysqlclient>=2.3.0",
    "pydantic>=2.14.3",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
extend-exclude = ["*/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
